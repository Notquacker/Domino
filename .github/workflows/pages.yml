# Publishes the standalone pass-and-play demo to GitHub Pages.
#
# Pages serves static files only, so this is the demo, not the multiplayer
# game: that needs a running Node process for the authoritative server and
# its WebSockets, which Pages cannot provide. See README.md for deploying
# the real thing.
name: Deploy demo to Pages

on:
  push:
    branches: [ccr-064abddc-ejnnem, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The demo embeds the rules engine, so a broken engine must not ship.
      - name: Test the rules engine
        run: npm run test:rules

      - run: npm run build:demo

      # Turns Pages on for the repo if it is not already, so there is no
      # manual settings step before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
