# Publishes the standalone pass-and-play demo to GitHub Pages.
#
# ONE-TIME SETUP: enable Pages first, under
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until that is done every run fails at "Configure Pages" with
# "Get Pages site failed ... Not Found". The workflow cannot do it itself:
# the Actions token is refused ("Resource not accessible by integration"),
# because creating a Pages site needs repository admin, not a workflow.
#
# Pages serves static files only, so this is the demo, not the multiplayer
# game: that needs a running Node process for the authoritative server and
# its WebSockets, which Pages cannot provide. See README.md for deploying
# the real thing.
name: Deploy demo to Pages

on:
  push:
    branches: [ccr-064abddc-ejnnem, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The demo embeds the rules engine, so a broken engine must not ship.
      - name: Test the rules engine
        run: npm run test:rules

      - run: npm run build:demo

      # Reads the repository's Pages configuration. Requires Pages to be
      # enabled already — see the note at the top of this file.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
